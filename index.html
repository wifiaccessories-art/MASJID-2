<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Masjid TV Display</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #061322;
      color: #fff7dd;
    }

    body {
      background:
        radial-gradient(circle at top left, rgba(255, 214, 112, 0.14), transparent 32%),
        linear-gradient(135deg, #061120 0%, #08233a 52%, #030812 100%);
    }

    .screen {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 8px;
      gap: 8px;
    }

    .top-bar {
      height: 92px;
      min-height: 92px;
      display: grid;
      grid-template-columns: 290px 1fr;
      gap: 8px;
    }

    .clock-panel,
    .header-panel,
    .content-panel {
      background: rgba(0, 0, 0, 0.34);
      border: 2px solid rgba(255, 214, 112, 0.36);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.28);
    }

    .clock-panel {
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 6px 12px;
    }

    .clock-time {
      width: 100%;
      text-align: center;
      color: #ffd670;
      font-weight: 900;
      line-height: 1;
      letter-spacing: 0.5px;
      white-space: nowrap;
      font-size: clamp(34px, 3.1vw, 58px);
    }

    .header-panel {
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 6px 26px;
    }

    .header-message {
      width: 100%;
      text-align: center;
      font-weight: 900;
      color: #fff7dd;
      line-height: 1.12;
      white-space: pre-line;
      overflow-wrap: break-word;
      text-shadow: 0 4px 16px rgba(0, 0, 0, 0.48);
      direction: auto;
    }

    .content-panel {
      flex: 1;
      min-height: 0;
      position: relative;
      overflow: hidden;
      border-radius: 24px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    .slide-wrap {
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      animation: fadeSlide 0.55s ease;
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: scale(1.006); }
      to { opacity: 1; transform: scale(1); }
    }

    .media-slide {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    .media-slide img,
    .media-slide video {
      width: 100%;
      height: 100%;
      display: block;
      max-width: none;
      max-height: none;
    }

    .fit-stretch { object-fit: fill; }
    .fit-cover { object-fit: cover; }
    .fit-contain { object-fit: contain; }

    .text-slide {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 42px 54px;
      background:
        radial-gradient(circle at center, rgba(255, 214, 112, 0.12), transparent 44%),
        linear-gradient(135deg, #07101f 0%, #0b263d 55%, #050b14 100%);
    }

    .text-slide .slide-text {
      max-width: 96%;
      color: #fff7dd;
      font-weight: 900;
      line-height: 1.18;
      white-space: pre-line;
      overflow-wrap: break-word;
      text-shadow: 0 5px 18px rgba(0, 0, 0, 0.55);
    }

    .status {
      display: none !important;
      position: absolute;
      right: 22px;
      bottom: 16px;
      color: #fff7dd;
      font-size: 28px;
      font-weight: 900;
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.85);
      z-index: 5;
    }

    .error-box {
      text-align: center;
      color: #fff7dd;
      font-size: 36px;
      font-weight: 900;
      line-height: 1.35;
      padding: 24px;
    }

    @media (max-width: 900px) {
      .screen { padding: 6px; gap: 6px; }
      .top-bar {
        height: 86px;
        min-height: 86px;
        grid-template-columns: 220px 1fr;
      }
      .clock-time { font-size: 34px; }
      .header-panel { padding: 6px 14px; }
    }
  
    #statusText,
    .status {
      display: none !important;
    }

  </style>
</head>
<body>
  <div class="screen">
    <div class="top-bar">
      <div class="clock-panel">
        <div class="clock-time" id="clockTime">--:--</div>
      </div>
      <div class="header-panel">
        <div class="header-message" id="headerMessage">Loading...</div>
      </div>
    </div>

    <div class="content-panel">
      <div class="slide-wrap" id="slideWrap">
        <div class="error-box">Loading content...</div>
      </div>
    </div>
  </div>

  <script>
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxzhMHRbNuSB2pWN66myHjiG8xGoUCoXzF2G08-ETZ7rCJndcBWplR4W4bce6258yK_/exec';
    const TIMEZONE = 'America/Toronto';

    let slides = [];
    let slideIndex = 0;
    let slideTimer = null;
    let refreshTimer = null;

    let currentSettings = {
      refresh_seconds: 300,
      header_font_size: 56,
      slide_text_font_size: 72
    };

    function updateClock() {
      const now = new Date();
      const timeText = now.toLocaleTimeString('en-US', {
        timeZone: TIMEZONE,
        hour: 'numeric',
        minute: '2-digit',
        hour12: true
      }).toUpperCase();
      document.getElementById('clockTime').textContent = timeText;
    }

    setInterval(updateClock, 1000);
    updateClock();

    function escapeHTML(value) {
      return String(value || '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function safeFontSize(value, fallback) {
      const n = Number(value);
      if (!isFinite(n) || n < 16) return fallback;
      return Math.min(n, 700);
    }

    function getFitClass(fit) {
      const value = String(fit || 'stretch').toLowerCase().trim();
      if (value === 'cover') return 'fit-cover';
      if (value === 'contain') return 'fit-contain';
      return 'fit-stretch';
    }

    function convertCommonLinks(url) {
      if (!url) return '';
      let clean = String(url).trim();

      if (clean.includes('github.com') && clean.includes('/blob/')) {
        clean = clean.replace('https://github.com/', 'https://raw.githubusercontent.com/').replace('/blob/', '/');
      }

      const driveMatch = clean.match(/drive\.google\.com\/file\/d\/([^/]+)/);
      if (driveMatch && driveMatch[1]) {
        clean = 'https://drive.google.com/uc?export=view&id=' + driveMatch[1];
      }

      return clean;
    }

    function loadData() {
      const callbackName = 'masjidPermanentHeaderCallback_' + Date.now();

      window[callbackName] = function(data) {
        try {
          currentSettings = data.settings || currentSettings;
          applyHeader(data.header || {});

          slides = Array.isArray(data.slides) && data.slides.length
            ? data.slides
            : [{ type: 'text', message: 'Welcome to Masjid Peace Niagara Falls', durationSeconds: 20, fit: 'stretch' }];

          if (slideIndex >= slides.length) slideIndex = 0;
          showSlide();

          clearTimeout(refreshTimer);
          const refreshSeconds = Number(currentSettings.refresh_seconds || 300);
          refreshTimer = setTimeout(loadData, refreshSeconds * 1000);
        } finally {
          delete window[callbackName];
          const oldScript = document.getElementById(callbackName);
          if (oldScript) oldScript.remove();
        }
      };

      const script = document.createElement('script');
      script.id = callbackName;
      script.src = APPS_SCRIPT_URL + '?callback=' + callbackName + '&t=' + Date.now();
      script.onerror = function() {
        document.getElementById('slideWrap').innerHTML = '<div class="error-box">Unable to load Google Sheet data.<br>Please check Apps Script URL and deployment.</div>';
      };
      document.body.appendChild(script);
    }

    function applyHeader(header) {
      const headerEl = document.getElementById('headerMessage');
      const message = header.message || 'WELCOME TO MASJID PEACE NIAGARA FALLS';
      const fontSize = safeFontSize(header.fontSize || currentSettings.header_font_size, 56);

      headerEl.innerHTML = escapeHTML(message);
      headerEl.style.fontSize = fontSize + 'px';
    }

    function showSlide() {
      clearTimeout(slideTimer);

      const slideWrap = document.getElementById('slideWrap');
if (!slides.length) return;

      const slide = slides[slideIndex];
      const type = String(slide.type || 'text').toLowerCase().trim();
      const durationMs = Number(slide.durationSeconds || currentSettings.slide_default_duration_seconds || 20) * 1000;
      const fitClass = getFitClass(slide.fit || 'stretch');
      const mediaUrl = convertCommonLinks(slide.mediaUrl || '');
if (type === 'image') {
        slideWrap.innerHTML = '<div class="media-slide"><img src="' + escapeHTML(mediaUrl) + '" class="' + fitClass + '" alt="Masjid slide image"></div>';
        slideTimer = setTimeout(nextSlide, durationMs);
        return;
      }

      if (type === 'video') {
        slideWrap.innerHTML = '<div class="media-slide"><video id="contentVideo" src="' + escapeHTML(mediaUrl) + '" class="' + fitClass + '" autoplay muted playsinline loop></video></div>';
        const video = document.getElementById('contentVideo');
        if (video) {
          video.onerror = function() {
            slideWrap.innerHTML = '<div class="error-box">Video could not load.<br>Please use a public direct MP4 link.</div>';
          };
          video.play().catch(() => {});
        }
        slideTimer = setTimeout(nextSlide, durationMs);
        return;
      }

      const textFontSize = safeFontSize(slide.textFontSize || currentSettings.slide_text_font_size, 72);
      slideWrap.innerHTML = '<div class="text-slide"><div class="slide-text" style="font-size:' + textFontSize + 'px;">' + escapeHTML(slide.message || '') + '</div></div>';
      slideTimer = setTimeout(nextSlide, durationMs);
    }

    function nextSlide() {
      slideIndex = (slideIndex + 1) % slides.length;
      showSlide();
    }

    loadData();
  </script>
</body>
</html>
